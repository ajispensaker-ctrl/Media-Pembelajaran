<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Game Edukasi AI Generatif - IFP Kelas 7</title>
    <meta name="description" content="Media Pembelajaran Interaktif Papan Digital (IFP) SMP Kelas 7 Fase D untuk materi Kecerdasan Artifisial Generatif dengan 3 mode: Labirin, Tarik Tambang, dan Kuis Rebutan multi-touch." />
    <meta property="og:title" content="Game Edukasi AI Generatif - IFP Kelas 7" />
    <meta property="og:description" content="Media Pembelajaran Interaktif Papan Digital (IFP) SMP Kelas 7 Fase D untuk materi Kecerdasan Artifisial Generatif dengan 3 mode: Labirin, Tarik Tambang, dan Kuis Rebutan multi-touch." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <style>
      * {
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #020617;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body oncontextmenu="return false;" onselectstart="return false;">
    <div id="root"></div>
    <script>
      // Nonaktifkan gesture pinch-to-zoom di IFP
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
